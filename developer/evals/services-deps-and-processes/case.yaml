schema_version: "1.1"
name: services-deps-and-processes
expected_outcome: |
  Each service is started as its own process (the two services both have a config.py and must not be loaded into one interpreter). The dependency check compares imports with requirements.txt and finds that yaml (PyYAML) is imported but not declared while flask is declared but unused. The end-to-end result is reported from real requests, any dependency problem is reported honestly with its cause, the manifest is fixed or the gap is flagged, and the background processes are stopped at the end.
context:
  scaffold_script: place-files.sh
