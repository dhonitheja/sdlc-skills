<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Newsletter</title></head>
<body>
<main>
  <h1>Subscribe</h1>
  <form id="f">
    <label for="email">Email address</label>
    <input id="email" name="email" type="email" required>
    <button type="submit">Subscribe</button>
  </form>
  <div id="status" aria-live="polite"></div>
</main>
<script>
const f = document.getElementById('f');
const s = document.getElementById('status');
async function submit() {
  s.textContent = 'Subscribing...';
  try {
    const r = await fetch('/api/subscribe', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({email: document.getElementById('email').value})
    });
    if (!r.ok) throw new Error('bad status ' + r.status);
    s.textContent = 'Thanks! Check your inbox.';
  } catch (e) {
    s.innerHTML = '<span role="alert">Could not subscribe.</span> <button type="button" id="retry">Try again</button>';
    document.getElementById('retry').onclick = submit;
  }
}
f.addEventListener('submit', e => { e.preventDefault(); submit(); });
</script>
</body>
</html>
